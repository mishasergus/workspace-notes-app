<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Workspace Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; text-align: center; }
        #qr-container { padding: 20px; border: 1px solid #ddd; display: inline-block; border-radius: 8px; }
        #main-app { display: none; text-align: left; }
        #chat-list { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 10px; }
    </style>
</head>
<body>

    <!-- Екран авторизації -->
    <div id="auth-screen">
        <h2>Авторизація через QR-код</h2>
        <p>Відкрийте Telegram на телефоні ➔ Налаштування ➔ Пристрої ➔ Підключити пристрій</p>
        <div id="qr-container">
            <img id="qr-image" src="" alt="Скануйте QR-код" style="display:none; width: 250px;">
            <p id="qr-status">Генерація QR-коду...</p>
        </div>
    </div>

    <!-- Основний інтерфейс (показується після входу) -->
    <div id="main-app">
        <h2>Personal Workspace</h2>
        <div id="chat-list"></div>
    </div>

    <script>
        async function checkAuth() {
            try {
                const res = await fetch('/api/auth/qr');
                const data = await res.json();

                if (data.status === 'authorized') {
                    document.getElementById('auth-screen').style.display = 'none';
                    document.getElementById('main-app').style.display = 'block';
                    loadDialogs();
                } else if (data.status === 'qr') {
                    document.getElementById('qr-image').src = data.qr;
                    document.getElementById('qr-image').style.display = 'block';
                    document.getElementById('qr-status').style.display = 'none';
                    setTimeout(checkAuth, 2000);
                } else {
                    setTimeout(checkAuth, 2000);
                }
            } catch (e) {
                setTimeout(checkAuth, 3000);
            }
        }

        async function loadDialogs() {
            const res = await fetch('/api/dialogs');
            const dialogs = await res.json();
            const list = document.getElementById('chat-list');
            list.innerHTML = dialogs.map(d => `<div><strong>${d.name}</strong> (ID: ${d.id})</div>`).join('');
        }

        checkAuth();
    </script>
</body>
</html>
