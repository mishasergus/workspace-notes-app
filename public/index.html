<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Workspace Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; text-align: center; }
        #qr-box { border: 1px solid #ccc; padding: 20px; display: inline-block; border-radius: 8px; margin-top: 15px; }
        #qr-image { width: 250px; height: 250px; display: none; margin: 0 auto; }
        #main-app { display: none; text-align: left; }
        .chat-item { padding: 10px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <h2>Авторизація через QR-код</h2>
        <p>Telegram ➔ Налаштування ➔ Пристрої ➔ Підключити пристрій</p>
        <div id="qr-box">
            <p id="status-text">Завантаження та генерація QR...</p>
            <img id="qr-image" src="" alt="QR Code">
        </div>
    </div>

    <div id="main-app">
        <h2>Останні чати</h2>
        <div id="chat-list"></div>
    </div>

    <script>
        async function checkStatus() {
            try {
                const res = await fetch('/api/auth/status');
                const data = await res.json();

                if (data.status === 'authorized') {
                    document.getElementById('auth-screen').style.display = 'none';
                    document.getElementById('main-app').style.display = 'block';
                    loadDialogs();
                } else if (data.status === 'qr') {
                    document.getElementById('status-text').style.display = 'none';
                    const img = document.getElementById('qr-image');
                    img.src = data.qr;
                    img.style.display = 'block';
                    setTimeout(checkStatus, 2000);
                } else {
                    setTimeout(checkStatus, 2000);
                }
            } catch (err) {
                console.error(err);
                setTimeout(checkStatus, 3000);
            }
        }

        async function loadDialogs() {
            const res = await fetch('/api/dialogs');
            const dialogs = await res.json();
            const container = document.getElementById('chat-list');
            container.innerHTML = dialogs.map(d => `<div class="chat-item"><strong>${d.name}</strong></div>`).join('');
        }

        checkStatus();
    </script>
</body>
</html>
